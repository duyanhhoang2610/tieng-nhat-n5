<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Học Tiếng Nhật Sơ Cấp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <div class="logo">日本語 Minna no Nihongo</div>
    <div class="user-control" id="userControl">
      <!-- Sẽ được JS render động tùy trạng thái đăng nhập -->
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar Bài học -->
    <aside class="sidebar" id="sidebar" style="display: none;">
      <h3>Danh Sách Bài Học</h3>
      <ul id="lessonList">
        <!-- Render bài học tự động từ data.js -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- Form Đăng Nhập -->
      <section id="loginSection" class="auth-box">
        <h2>Đăng Nhập</h2>
        <form id="loginForm">
          <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" id="loginUser" required>
          </div>
          <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="loginPass" required>
          </div>
          <button type="submit" class="btn">Đăng Nhập</button>
          <p>Chưa có tài khoản? <a href="#" onclick="showAuth('register')">Đăng ký ngay</a></p>
        </form>
      </section>

      <!-- Form Đăng Ký -->
      <section id="registerSection" class="auth-box" style="display: none;">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm">
          <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" id="regUser" required>
          </div>
          <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="regPass" required>
          </div>
          <button type="submit" class="btn">Đăng Ký</button>
          <p>Đã có tài khoản? <a href="#" onclick="showAuth('login')">Đăng nhập</a></p>
        </form>
      </section>

      <!-- Nội dung Bài Học -->
      <section id="lessonContent" style="display: none;">
        <h1 id="lessonTitle">Chọn bài học để bắt đầu</h1>
        
        <!-- Navigation Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="openTab('vocabTab')">Từ Vựng</button>
          <button class="tab-btn" onclick="openTab('kanjiTab')">Chữ Hán (Kanji)</button>
          <button class="tab-btn" onclick="openTab('grammarTab')">Ngữ Pháp</button>
          <button class="tab-btn" onclick="openTab('kaiwaTab')">Hội Thoại</button>
        </div>

        <!-- Tab Contents -->
        <div id="vocabTab" class="tab-content active"></div>
        <div id="kanjiTab" class="tab-content" style="display:none;"></div>
        <div id="grammarTab" class="tab-content" style="display:none;"></div>
        <div id="kaiwaTab" class="tab-content" style="display:none;"></div>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
