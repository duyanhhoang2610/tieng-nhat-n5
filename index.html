<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Học Tiếng Nhật Sơ Cấp</title>
  <!-- Nhúng Font Google Font (Plus Jakarta Sans & Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #e60012; /* Màu đỏ Nhật Bản */
      --primary-hover: #c4000f;
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --border-color: #e2e8f0;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navbar */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary-color);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(230, 0, 18, 0.3);
    }

    /* Layout chính */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Card Đăng nhập / Đăng ký */
    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Họa tiết trang trí nền Nhật Bản */
    .auth-card::before {
      content: "🌸";
      position: absolute;
      top: -15px;
      right: -10px;
      font-size: 5rem;
      opacity: 0.08;
      pointer-events: none;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h2 {
      font-size: 1.75rem;
      color: var(--text-main);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background: #fafafa;
      outline: none;
    }

    .form-group input:focus {
      background: #fff;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(230, 0, 18, 0.1);
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(230, 0, 18, 0.25);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(230, 0, 18, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Auth Footer Links */
    .auth-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* Thẻ thông báo gợi ý */
    .hint-box {
      background: #fff5f5;
      border: 1px dashed #feb2b2;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #c53030;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">日</div>
      <span>Minna no Nihongo</span>
    </div>
  </header>

  <!-- Container Chính -->
  <div class="main-container">

    <!-- Card Đăng Nhập -->
    <section id="loginSection" class="auth-card">
      <div class="auth-header">
        <h2>Đăng Nhập</h2>
        <p>Chào mừng bạn quay trở lại hành trình học tiếng Nhật!</p>
      </div>

      <div class="hint-box">
        💡 <b>Tài khoản dùng thử:</b><br>
        • Tên đăng nhập: <b>demo</b> | Mật khẩu: <b>123</b>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUser">Tên đăng nhập</label>
          <input type="text" id="loginUser" placeholder="Nhập tên đăng nhập..." value="demo" required>
        </div>

        <div class="form-group">
          <label for="loginPass">Mật khẩu</label>
          <input type="password" id="loginPass" placeholder="Nhập mật khẩu..." value="123" required>
        </div>

        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="#" onclick="switchForm('register')">Đăng ký ngay</a>
      </div>
    </section>

    <!-- Card Đăng Ký (Ẩn mặc định) -->
    <section id="registerSection" class="auth-card" style="display: none;">
      <div class="auth-header">
        <h2>Tạo Tài Khoản</h2>
        <p>Bắt đầu chinh phục N5 - N1 ngay hôm nay</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regUser">Tên đăng nhập</label>
          <input type="text" id="regUser" placeholder="Tạo tên đăng nhập..." required>
        </div>

        <div class="form-group">
          <label for="regPass">Mật khẩu</label>
          <input type="password" id="regPass" placeholder="Tạo mật khẩu..." required>
        </div>

        <button type="submit" class="btn-submit">Đăng Ký Tài Khoản</button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="#" onclick="switchForm('login')">Đăng nhập</a>
      </div>
    </section>

  </div>

  <script>
    // Chuyển đổi qua lại giữa Form Đăng Nhập và Đăng Ký
    function switchForm(type) {
      const loginSection = document.getElementById('loginSection');
      const registerSection = document.getElementById('registerSection');

      if (type === 'register') {
        loginSection.style.display = 'none';
        registerSection.style.display = 'block';
      } else {
        registerSection.style.display = 'none';
        loginSection.style.display = 'block';
      }
    }
  </script>
</body>
</html>
